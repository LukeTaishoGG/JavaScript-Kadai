<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./style.css">
  <title>JavaScript総合課題</title>
</head>
<body>
  <h1>JavaScript総合課題</h1>
  <main>
    <div class="screen-log">
      <div id="gameScreen" class="game-screen">
        <div class="display-left">
          <player id="playerStatus" class="player-status">
            <p id="playerHP" class="player-hp"></p>
            <p id="playerAttacP" class="player-attac-p"></p>
            <p id="playerLevel" class="player-level"></p>
          </player>
          <div id="controller" class="controller">
            <button id="upButton" class="up-button">↑</button>
            <div class="left-right">
              <button id="leftButton" class="left-button">←</button>
              <button id="rightButton" class="right-button">→</button>
            </div>
            <button id="downButton" class="down-button">↓</button>
          </div>
        </div>
        <div id="characterImg" class="character-img"></div>
        <div class = startBattle>
          <button id="fightButton" class="fight-button">戦う</button>
          <button id="runButton" class="run-button">逃げる</button>
        </div>
      </div>
      <div id="gameLog" class="game-log">
        <p class="log-title">ログ</p>
      </div>
    </div>
  </main>
  <script src="map-data.js" defer></script>
  <script src="function.js" defer></script>
  <script src="status-data.js" defer></script>
  <script src="start-battle.js" defer></script>
  <script src="script.js" defer></script>
</body>
